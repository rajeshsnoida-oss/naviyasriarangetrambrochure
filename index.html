<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
  <title>Invitation</title>
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    html,body{width:100%;height:100%;overflow:hidden;}
    body{
      background:#1a0a2e;background-image:url('images/bg.jpg');background-size:cover;background-position:center;
      display:flex;align-items:center;justify-content:center;
    }
    /* #page sized by JS to maintain 900:560 ratio, avoiding the iOS 100vh browser-chrome bug */
    #page{position:relative;overflow:hidden;flex-shrink:0;}
    #page-inv{display:block;width:100%;height:100%;}
    /* links-layer is always 900x560 canvas space; JS scales it to match #page */
    #links-layer{
      position:absolute;top:0;left:0;width:900px;height:560px;
      transform-origin:top left;
    }
    .lnk-icon{
      position:absolute;display:flex;align-items:center;justify-content:center;
      width:40px;height:40px;border-radius:50%;
      text-decoration:none;box-shadow:0 2px 8px rgba(0,0,0,.6);
    }
    .lnk-btn{
      position:absolute;display:inline-flex;align-items:center;
      padding:7px 14px;border-radius:20px;
      text-decoration:none;white-space:nowrap;
      box-shadow:0 2px 8px rgba(0,0,0,.6);
    }
  </style>
</head>
<body>
  <div id="page">
    <img id="page-inv" src="images/invitation.png" alt="Invitation">
    <div id="links-layer">

    </div>
  </div>
  <script>
    function layout() {
      var vw = document.documentElement.clientWidth;
      var vh = document.documentElement.clientHeight;
      var s  = Math.min(vw / 900, vh / 560);
      var page = document.getElementById('page');
      page.style.width  = Math.round(900 * s) + 'px';
      page.style.height = Math.round(560 * s) + 'px';
      document.getElementById('links-layer').style.transform = 'scale(' + s + ')';
    }
    layout();
    window.addEventListener('resize', layout);
  </script>
</body>
</html>
